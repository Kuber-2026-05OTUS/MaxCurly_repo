---
repositories:
  - name: bitnami
    url: https://mirror.yandex.ru/helm/charts.bitnami.com/

releases:

  - name: kafka-prod
    namespace: prod
    chart: bitnami/kafka
    version: 30.1.2
    set:

      - name: image.repository
        value: bitnamilegacy/kafka
      - name: image.tag
        value: 3.5.2
      - name: controller.replicaCount
        value: 5

#      - name: kraft.enabled
#        value: false
#      - name: zookeeper.enabled
#        value: true
#      - name: zookeeper.replicaCount
#        value: 3
#      - name: zookeeper.image.repository
#        value: bitnamilegacy/zookeeper
#      - name: zookeeper.image.tag
#        value: 3.9.3-debian-12-r22
#      - name: controller.replicaCount
#        value: 0

      - name: listeners.client.protocol
        value: SASL_PLAINTEXT
      - name: listeners.interbroker.protocol
        value: SASL_PLAINTEXT

  - name: kafka-dev
    namespace: dev
    chart: bitnami/kafka
    version: 30.1.2
    set:

      - name: image.repository
        value: bitnamilegacy/kafka
      - name: image.tag
        value: latest
      - name: controller.replicaCount
        value: 1

#      - name: kraft.enabled
#        value: false
#      - name: zookeeper.enabled
#        value: true
#      - name: zookeeper.replicaCount
#        value: 1
#      - name: zookeeper.image.repository
#        value: bitnamilegacy/zookeeper
#      - name: zookeeper.image.tag
#        value: 3.9.3-debian-12-r22
#      - name: controller.replicaCount
#        value: 0

      - name: listeners.client.protocol
        value: PLAINTEXT
      - name: listeners.interbroker.protocol
        value: PLAINTEXT

      - name: auth.enabled
        value: false
