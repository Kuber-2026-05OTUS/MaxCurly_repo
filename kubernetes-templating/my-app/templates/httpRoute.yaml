apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homework-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: {{ .Values.namespace }}
  hostnames:
    - {{ .Values.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /homepage
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /index.html
      backendRefs:
        - name: {{ .Chart.Name }}-service
          port: {{ .Values.service_port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Chart.Name }}-service
          port: {{ .Values.service_port }}
