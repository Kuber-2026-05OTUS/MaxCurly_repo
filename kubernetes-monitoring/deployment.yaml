apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-monitoring
  namespace: homework
  labels:
    app: kubernetes-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-monitoring
  template:
    metadata:
      labels:
        app: kubernetes-monitoring
    spec:
      serviceAccountName: default
      containers:
        - name: nginx-container
          image: nginx:1.31.3
          ports:
            - name: web
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /stub_status
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
        - name: nginx-exporter-container
          image: nginx/nginx-prometheus-exporter:1.5.1
          args:
          - '-nginx.scrape-uri=http://localhost/stub_status'
          ports:
            - name: metrics
              containerPort: 9113
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9113
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9113
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
      volumes:
        - name: config
          configMap:
            name: nginx-default-conf
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-default-conf
  namespace: homework
data:
  default.conf: |
    server {
        listen       80;
        listen  [::]:80;
        server_name  localhost;
    
        #access_log  /var/log/nginx/host.access.log  main;
    
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }
    
        location /stub_status {
            stub_status on;
            access_log on;
            allow all;
        }

        #error_page  404              /404.html;
    
        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    
        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}
    
        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}
    
        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }
---

apiVersion: v1
kind: Service
metadata:
  name: kubernetes-monitoring-service
  namespace: homework
  labels:
    app: kubernetes-monitoring
spec:
  type: ClusterIP
  selector:
    app: kubernetes-monitoring
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: metrics
    port: 9113
    targetPort: 9113
    protocol: TCP
  sessionAffinity: None

